name: web-deploy

# Builds and deploys web/ to GitHub Pages at the custom domain (arch-deployment).
# Runs only for web-relevant changes, plus a manual trigger. Never for api-only changes
# (except api/openapi.json, which web/ consumes via the generated types, ADR-0010).
on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - "api/openapi.json"
      - ".github/workflows/web-deploy.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Regenerate API types
        run: npm run api:types

      - name: Verify generated API types are current (ADR-0010)
        run: git diff --exit-code -- lib/api/schema.d.ts

      - name: Build (static export)
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}

      - name: Verify 404.html exists
        run: test -f out/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
