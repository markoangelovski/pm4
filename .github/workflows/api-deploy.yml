name: api-deploy

# Builds, migrates (Neon) and deploys api/ to the Azure Web App (arch-deployment).
# Runs only for api-relevant changes, plus a manual trigger. Never for web-only changes.
# No lint/type-check/tests here: ci.yml already ran them on this exact tree. The `master` ruleset requires
# `ci-ok` with "branch must be up to date", so the squash commit is the tree CI tested. If that rule is
# ever turned off, put the checks back here.
on:
  push:
    branches: [master]
    paths:
      - "api/**"
      - ".github/workflows/api-deploy.yml"
  workflow_dispatch:

concurrency:
  group: api-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      bump: ${{ steps.release.outputs.bump }}
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # history and tags for the release version

      - uses: actions/setup-node@v7
        with:
          node-version-file: api/.nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Release version (OQ-098): next semver from api-v* tags and conventional commits; the stamped
      # package.json is never committed (the repo stays at 0.0.0).
      - name: Release version
        id: release
        run: node ../scripts/release-version.mjs api

      - name: Stamp version
        run: npm version "${{ steps.release.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Changelog
        run: node ../scripts/changelog.mjs api changelog.json

      - name: Build
        run: npm run build

      - name: Stage deployment package
        run: |
          rm -rf deploy
          mkdir -p deploy
          cp -r dist deploy/dist
          cp package.json package-lock.json changelog.json deploy/
          cp -r drizzle deploy/drizzle
          cd deploy
          npm ci --omit=dev

      - uses: actions/upload-artifact@v7
        with:
          name: api-deploy-package
          path: api/deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: production
      url: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: api-deploy-package
          path: deploy

      - name: Verify DATABASE_URL_DIRECT is set
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
        run: |
          if [ -z "$DATABASE_URL_DIRECT" ]; then
            echo "::error::DATABASE_URL_DIRECT secret is not set. Refusing to run migrations."
            exit 1
          fi

      - name: Run database migrations (Neon, direct connection)
        working-directory: deploy
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
        run: node dist/scripts/migrate.js

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy

      - name: Smoke check (/health)
        env:
          API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
        run: |
          for i in $(seq 1 18); do
            status=$(curl -s -o /dev/null -w '%{http_code}' "$API_BASE_URL/health" || true)
            if [ "$status" = "200" ]; then
              echo "Health check passed ($status)."
              exit 0
            fi
            echo "Attempt $i: health check returned $status, retrying in 10s..."
            sleep 10
          done
          echo "::error::API health check did not return 200 within ~3 minutes."
          exit 1

      - name: Tag the release
        if: needs.build.outputs.bump != 'none'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if existing=$(gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null); then
            [ "$existing" = "${{ github.sha }}" ] || echo "::warning::$TAG already points to $existing; not moved."
          else
            gh api "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$TAG" -f sha="${{ github.sha }}"
          fi
